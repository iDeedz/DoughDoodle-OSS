<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Main envelope 1 -->
  <g transform="translate(80, 80)">
    <rect x="0" y="20" width="120" height="80" rx="4" fill="#0d6efd" opacity="0.9"/>
    <polygon points="0,20 60,60 120,20" fill="#0d6efd"/>
    <polygon points="0,20 60,50 120,20" fill="#ffffff" opacity="0.3"/>
    <text x="60" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">GROCERIES</text>
  </g>
  
  <!-- Main envelope 2 -->
  <g transform="translate(220, 60)">
    <rect x="0" y="20" width="120" height="80" rx="4" fill="#198754" opacity="0.9"/>
    <polygon points="0,20 60,60 120,20" fill="#198754"/>
    <polygon points="0,20 60,50 120,20" fill="#ffffff" opacity="0.3"/>
    <text x="60" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">RENT</text>
  </g>
  
  <!-- Main envelope 3 -->
  <g transform="translate(360, 80)">
    <rect x="0" y="20" width="120" height="80" rx="4" fill="#dc3545" opacity="0.9"/>
    <polygon points="0,20 60,60 120,20" fill="#dc3545"/>
    <polygon points="0,20 60,50 120,20" fill="#ffffff" opacity="0.3"/>
    <text x="60" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UTILITIES</text>
  </g>
  
  <!-- Secondary envelope 1 -->
  <g transform="translate(150, 180)">
    <rect x="0" y="20" width="100" height="70" rx="4" fill="#ffc107" opacity="0.8"/>
    <polygon points="0,20 50,50 100,20" fill="#ffc107"/>
    <polygon points="0,20 50,45 100,20" fill="#ffffff" opacity="0.3"/>
    <text x="50" y="65" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ENTERTAINMENT</text>
  </g>
  
  <!-- Secondary envelope 2 -->
  <g transform="translate(280, 200)">
    <rect x="0" y="20" width="100" height="70" rx="4" fill="#20c997" opacity="0.8"/>
    <polygon points="0,20 50,50 100,20" fill="#20c997"/>
    <polygon points="0,20 50,45 100,20" fill="#ffffff" opacity="0.3"/>
    <text x="50" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SAVINGS</text>
  </g>
  
  <!-- Money/Dollar signs floating around -->
  <text x="50" y="50" fill="#28a745" font-family="Arial, sans-serif" font-size="24" opacity="0.6">$</text>
  <text x="520" y="120" fill="#28a745" font-family="Arial, sans-serif" font-size="20" opacity="0.5">$</text>
  <text x="450" y="300" fill="#28a745" font-family="Arial, sans-serif" font-size="18" opacity="0.4">$</text>
  <text x="100" y="320" fill="#28a745" font-family="Arial, sans-serif" font-size="22" opacity="0.5">$</text>
  
  <!-- Arrows showing money flow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto" fill="#6c757d">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <!-- Arrow from top left to first envelope -->
  <path d="M 60 70 Q 100 80 130 100" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Arrow from top center to second envelope -->
  <path d="M 300 40 Q 280 50 280 80" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Arrow from top right to third envelope -->
  <path d="M 520 70 Q 480 80 430 100" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Text label -->
  <text x="300" y="360" text-anchor="middle" fill="#495057" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Smart Budget Allocation</text>
  
  <!-- Small decorative elements -->
  <circle cx="550" cy="50" r="3" fill="#0d6efd" opacity="0.4"/>
  <circle cx="530" cy="70" r="2" fill="#198754" opacity="0.4"/>
  <circle cx="570" cy="80" r="2.5" fill="#dc3545" opacity="0.4"/>
  
  <circle cx="30" y="350" r="2.5" fill="#ffc107" opacity="0.4"/>
  <circle cx="50" y="370" r="2" fill="#20c997" opacity="0.4"/>
  <circle cx="70" y="360" r="3" fill="#6f42c1" opacity="0.4"/>
</svg>