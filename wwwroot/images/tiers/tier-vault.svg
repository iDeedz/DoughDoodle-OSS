<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VAULT plan badge">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#t)"/>
  <circle cx="100" cy="100" r="72" fill="#0B1220" opacity="0.35"/>
  <!-- geometric mint mark: stacked bars + coin -->
  <rect x="70" y="88" width="60" height="10" rx="3" fill="#ECFDF5"/>
  <rect x="78" y="104" width="44" height="8" rx="3" fill="#99F6E4"/>
  <rect x="86" y="118" width="28" height="6" rx="3" fill="#5EEAD4"/>
  <circle cx="100" cy="72" r="16" fill="#14B8A6" stroke="#ECFDF5" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#0B1220">$</text>
  <text x="100" y="48" text-anchor="middle" font-size="13" font-family="Inter, Segoe UI, sans-serif" font-weight="700" fill="#fff">VAULT</text>
  <text x="100" y="168" text-anchor="middle" font-size="12" font-family="Inter, Segoe UI, sans-serif" font-weight="600" fill="#ECFDF5">Vault</text>
</svg>
