<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Empty budget envelopes — paper slots ready to fund">
  <rect width="320" height="200" rx="16" fill="#F1F5F9"/>
  <!-- three paper envelopes -->
  <g transform="translate(36,48)">
    <rect width="72" height="52" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="0,0 36,28 72,0" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <g transform="translate(124,40)">
    <rect width="72" height="52" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <polygon points="0,0 36,28 72,0" fill="#99F6E4" stroke="#0D9488" stroke-width="2"/>
  </g>
  <g transform="translate(212,48)">
    <rect width="72" height="52" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <polygon points="0,0 36,28 72,0" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="160" y="140" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0B1220">No envelopes yet</text>
  <text x="160" y="162" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Fund this month — assign every dollar</text>
</svg>
