<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Cash clarity — dough left today, paper envelopes, metric cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="24" fill="url(#bg)"/>
  <!-- metric card -->
  <rect x="48" y="56" width="220" height="168" rx="16" fill="url(#card)" opacity="0.96"/>
  <text x="68" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#64748B">DOUGH LEFT TODAY</text>
  <text x="68" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#0B1220">$842</text>
  <rect x="68" y="158" width="120" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="68" y="158" width="78" height="8" rx="4" fill="#0D9488"/>
  <text x="68" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#334155">62% of daily allotment</text>
  <!-- paper envelopes -->
  <g transform="translate(300,70)">
    <rect x="0" y="36" width="110" height="72" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="0,36 55,78 110,36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <text x="55" y="128" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Groceries</text>
  </g>
  <g transform="translate(430,90)">
    <rect x="0" y="36" width="110" height="72" rx="6" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <polygon points="0,36 55,78 110,36" fill="#99F6E4" stroke="#0D9488" stroke-width="2"/>
    <text x="55" y="128" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#99F6E4">Rent</text>
  </g>
  <!-- mint coin mark -->
  <circle cx="560" cy="70" r="28" fill="#14B8A6" stroke="#0F766E" stroke-width="3"/>
  <text x="560" y="78" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#0B1220">$</text>
  <text x="48" y="42" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#99F6E4">Know your dough left today</text>
</svg>
